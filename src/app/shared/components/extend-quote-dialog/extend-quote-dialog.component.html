@if (isOpen()) {
  <div
    class="fixed inset-0 z-60 bg-zinc-900/40 backdrop-blur-sm transition-opacity"
    (click)="onBackdropClick()"
    (keydown.enter)="onBackdropClick()"
    (keydown.space)="onBackdropClick()"
    aria-hidden="true"
  ></div>
}

<dialog
  [attr.open]="isOpen() ? '' : null"
  class="fixed inset-0 z-70 m-auto w-[calc(100%-2rem)] max-w-md overflow-hidden rounded-2xl border border-zinc-100 bg-white p-0 shadow-2xl ring-1 ring-zinc-900/5 focus:outline-none"
  [attr.aria-modal]="true"
  role="alertdialog"
  [attr.aria-labelledby]="titleId()"
  [attr.aria-describedby]="descriptionId()"
  (keydown.escape)="onCancelClick()"
>
  <div class="flex flex-col p-6">
    <div class="mb-4">
      <h2 
        class="text-lg font-semibold leading-6 text-zinc-900" 
        [id]="titleId()"
      >
        {{ 'offertes.extendQuote' | translate }}
      </h2>

      <div class="mt-2 text-sm leading-relaxed text-zinc-500" [id]="descriptionId()">
        <p>{{ 'offertes.extendQuoteDescription' | translate }}</p>
      </div>
    </div>

    <form [formGroup]="form" class="mt-4 space-y-4">
      <shared-input
        [label]="'offertes.extendDays' | translate"
        type="number"
        min="1"
        max="365"
        [value]="extendDaysStr()"
        (valueChange)="onExtendDaysChange($event)"
      />
      
      @if (newValidUntil()) {
        <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
          <p class="text-sm text-blue-900">
            {{ 'offertes.newValidUntil' | translate: { date: newValidUntil() } }}
          </p>
        </div>
      }
    </form>

    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <shared-button
        class="w-full sm:w-auto"
        variant="secondary"
        (clicked)="onCancelClick()"
        ariaLabel="Cancel"
      >
        {{ 'common.cancel' | translate }}
      </shared-button>
      
      <shared-button
        #confirmButton
        class="w-full sm:w-auto"
        variant="primary"
        (clicked)="onConfirmClick()"
        ariaLabel="Extend"
      >
        {{ 'offertes.extend' | translate }}
      </shared-button>
    </div>
  </div>
</dialog>
