<shared-field-shell
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [error]="error()"
  [uid]="uid"
  [hintId]="hintId"
  [errorId]="errorId"
>
  <div class="rich-text-wrapper" [class.rich-text-wrapper-error]="!!error()">
    <quill-editor
      class="quill-editor-host"
      [id]="uid"
      [ngModel]="value()"
      (ngModelChange)="value.set($event ?? '')"
      [placeholder]="placeholder()"
      [modules]="modules"
      [styles]="{ height: minHeight() + 'px' }"
      [readOnly]="disabled()"
      [format]="'html'"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="!!error() || null"
      [attr.aria-describedby]="describedBy()"
    />

    @if (variables().length && showVariableDropdown()) {
      <div class="variable-dropdown" (click)="$event.stopPropagation()" (keydown.escape)="closeDropdown()">
        @for (v of variables(); track v.value) {
          <button type="button" class="variable-option" (click)="insertVariable(v)">
            <span class="variable-option-label">{{ v.label }}</span>
            <code class="variable-option-code" [textContent]="'{' + '{' + v.value + '}' + '}'"></code>
          </button>
        }
      </div>
    }
  </div>
</shared-field-shell>

@if (showVariableDropdown()) {
  <div class="variable-backdrop" (click)="closeDropdown()" (keydown.escape)="closeDropdown()"></div>
}
