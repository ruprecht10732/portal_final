<header class="flex items-center gap-4 p-4 sm:px-6">
  @if (showBack()) {
    <shared-button
      type="button"
      variant="ghost"
      size="compact"
      [iconOnly]="true"
      [fullWidth]="false"
      [uppercase]="false"
      (clicked)="back.emit()"
      [ariaLabel]="backAriaLabel()"
    >
      <lucide-icon name="arrow-left" class="h-4 w-4" aria-hidden="true"></lucide-icon>
    </shared-button>
  }

  <div class="flex flex-col">
    <h1 class="text-lg sm:text-xl font-bold uppercase tracking-tight leading-none">
      {{ title() }}
    </h1>
    <ng-content select="[subtitle]"></ng-content>
    @if (subtitle()) {
      <span class="text-xs uppercase tracking-widest text-zinc-400 mt-1">
        {{ subtitle() }}
      </span>
    }
  </div>

  <div class="ml-auto flex items-center gap-2">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
