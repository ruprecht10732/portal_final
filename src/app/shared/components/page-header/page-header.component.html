<!-- Mobile header -->
<header class="sm:hidden sticky top-0 z-40 grid grid-cols-[40px_1fr_40px] items-center border-b border-gray-100 bg-white/70 px-4 py-4 backdrop-blur">
  @if (showBack()) {
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-100/60 transition-transform active:scale-95"
      (click)="back.emit()"
      [attr.aria-label]="backAriaLabel()"
    >
      <lucide-icon name="chevron-left" class="h-5 w-5 text-slate-700" aria-hidden="true"></lucide-icon>
    </button>
  } @else {
    <div></div>
  }

  <div class="flex flex-col items-center overflow-hidden">
    @if (subtitle()) {
      <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">{{ subtitle() }}</span>
    }
    <div class="flex items-center justify-center gap-2 overflow-hidden">
      <h1 class="text-sm font-extrabold tracking-tight truncate max-w-55">{{ title() }}</h1>
      <ng-content select="[titleSuffix], [title-suffix], .title-suffix"></ng-content>
    </div>
  </div>

  <div class="flex items-center justify-end">
    <ng-content select="[mobileActions], [mobile-actions], .mobile-actions"></ng-content>
  </div>
</header>

<!-- Desktop header -->
<header class="hidden sm:flex items-center gap-4 p-4 sm:px-6">
  @if (showBack()) {
    <shared-button
      type="button"
      variant="ghost"
      size="compact"
      [iconOnly]="true"
      [fullWidth]="false"
      [uppercase]="false"
      (clicked)="back.emit()"
      [ariaLabel]="backAriaLabel()"
    >
      <lucide-icon name="arrow-left" class="h-4 w-4" aria-hidden="true"></lucide-icon>
    </shared-button>
  }

  <div class="flex min-w-0 flex-col">
    <div class="flex min-w-0 items-center gap-2">
      <h1 class="truncate text-lg sm:text-xl font-bold uppercase tracking-tight leading-none">
        {{ title() }}
      </h1>
      <ng-content select="[titleSuffix], [title-suffix], .title-suffix"></ng-content>
    </div>
    <ng-content select="[subtitle]"></ng-content>
    @if (subtitle()) {
      <span class="text-xs uppercase tracking-widest text-zinc-400 mt-1">
        {{ subtitle() }}
      </span>
    }
  </div>

  <div class="ml-auto flex items-center gap-2">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
