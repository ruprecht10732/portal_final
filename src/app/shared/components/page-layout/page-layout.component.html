<div class="flex flex-col gap-4 h-full min-h-0">
  <!-- Mobile header -->
  <header class="sm:hidden sticky top-0 z-40 flex items-center justify-between border-b border-gray-100 bg-white/70 px-4 py-3 backdrop-blur">
    <div class="min-w-0">
      <h1 class="text-lg font-extrabold tracking-tight text-slate-900 truncate">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="text-xs text-slate-400 truncate">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex gap-2 shrink-0">
      <ng-content select="[actions]"></ng-content>
    </div>
  </header>

  <!-- Desktop header -->
  <header class="hidden sm:flex items-center justify-between p-4 sm:px-6 border-b border-zinc-200">
    <div>
      <h1 class="text-xl font-bold uppercase tracking-tight">{{ title() }}</h1>
      <p class="text-sm text-zinc-500">{{ subtitle() }}</p>
    </div>
    <div class="flex gap-2">
      <ng-content select="[actionsDesktop], [actions-desktop], .actions-desktop"></ng-content>
      <ng-content select="[actions]"></ng-content>
    </div>
  </header>

  @if (error()) {
    <div class="px-4 sm:px-6">
      <div role="alert" aria-live="assertive" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm">
        {{ error() }}
      </div>
    </div>
  }

  <div
    class="flex-1 overflow-hidden xl:overflow-y-auto flex flex-col pb-4 min-h-0 min-w-0 sm:px-6"
    [class.px-4]="!removeMobilePadding()"
  >
    <ng-content></ng-content>
  </div>
</div>
