<section class="day-view">
  <button
    type="button"
    class="day-summary"
    [attr.aria-label]="day()?.ariaLabel"
    [disabled]="isUnavailable()"
    (click)="handleSelect()"
  >
    <span class="day-title">{{ dayTitle() }}</span>
    <span class="day-subtitle">{{ daySubtitle() }}</span>
  </button>

  <ul class="day-grid">
    @for (hour of hours(); track hour.value) {
      <li class="day-row">
        <div class="time-label">{{ hour.label }}</div>
        <button
          type="button"
          class="time-slot"
          [class.is-blocked]="isBlocked(hour.value)"
          [class.is-selected]="selectedTime() === hour.value"
          [disabled]="isBlocked(hour.value)"
          (click)="selectHour(hour.value)"
          [attr.aria-label]="isBlocked(hour.value) ? 'Unavailable time' : 'Select time'"
        ></button>
      </li>
    }
  </ul>
</section>
