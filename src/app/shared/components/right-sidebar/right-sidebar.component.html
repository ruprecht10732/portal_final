@if (rendered()) {
  <button
    type="button"
    class="fixed inset-0 z-1200 bg-black/50 transition-opacity duration-200 ease-out"
    [class.opacity-100]="entered()"
    [class.opacity-0]="!entered()"
    aria-label="Sluit paneel"
    (click)="onBackdropClick()"
  ></button>

  <dialog
    open
    class="fixed inset-y-0 right-0 left-auto z-1210 m-0 ml-auto mr-0 flex h-dvh w-full max-w-md flex-col overflow-hidden border-0 border-l border-zinc-200 bg-white p-0 shadow-2xl transition-transform duration-220 ease-out"
    [class.translate-x-0]="entered()"
    [class.translate-x-full]="!entered()"
    [attr.aria-label]="title() || 'Rechter zijbalk'"
    aria-modal="true"
  >
    <header class="flex items-center justify-between gap-3 border-b border-zinc-200 px-4 py-3">
      <h2 class="m-0 text-xs font-bold uppercase tracking-wide text-zinc-900">{{ title() }}</h2>

      <button
        type="button"
        class="inline-flex h-8 w-8 items-center justify-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900"
        aria-label="Sluit paneel"
        (click)="onCloseClick()"
      >
        <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto">
      <ng-content />
    </div>

    <footer class="shrink-0 border-t border-zinc-200 bg-white px-4 py-3">
      <ng-content select="[rightSidebarFooter]" />
    </footer>
  </dialog>
}
