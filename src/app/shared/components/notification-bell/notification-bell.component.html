<div class="relative">
  <shared-button
    variant="ghost"
    size="compact"
    [iconOnly]="true"
    shape="square"
    [fullWidth]="false"
    ariaLabel="Notificaties"
    [ariaExpanded]="isOpen()"
    ariaHaspopup="dialog"
    (clicked)="toggle()"
  >
    <span class="relative inline-flex">
      <lucide-icon name="bell" class="h-6 w-6"></lucide-icon>
      @if (hasUnread()) {
        <span class="absolute -right-1.5 -top-1.5 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true">{{ unreadCount() }}</span>
      }
    </span>
  </shared-button>

  @if (isOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-60 bg-transparent"
      aria-label="Sluit notificaties"
      (click)="close()"
    ></button>

    <dialog open class="absolute bottom-16 left-1/2 z-70 flex max-h-105 w-80 -translate-x-1/2 flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-2xl lg:bottom-13 lg:left-full lg:ml-3 lg:translate-x-0" aria-label="Notificaties">
      <header class="flex items-center justify-between gap-2 border-b border-zinc-200 px-3 py-2.5">
        <h3 class="m-0 text-xs font-bold uppercase tracking-wide">Notificaties</h3>
        @if (hasUnread()) {
          <button type="button" class="bg-transparent text-xs font-semibold text-zinc-700" (click)="onMarkAllRead($event)">
            Alles gelezen ({{ unreadInPanel() }})
          </button>
        }
      </header>

      @if (loading()) {
        <div class="px-3 py-4 text-xs text-zinc-600">Laden...</div>
      } @else if (notifications().length === 0) {
        <div class="px-3 py-4 text-xs text-zinc-600">Geen notificaties</div>
      } @else {
        <ul class="m-0 list-none overflow-y-auto p-0">
          @for (notification of notifications(); track trackById($index, notification)) {
            <li class="relative">
              <button
                type="button"
                class="flex w-full items-start gap-2.5 border-b border-zinc-100 bg-transparent px-3 py-2.5 pr-10 text-left hover:bg-zinc-50"
                [class.bg-zinc-50]="!notification.isRead"
                (click)="onNotificationClick(notification)"
              >
                <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-zinc-400" [class.bg-emerald-500]="notification.category === 'success'" [class.bg-amber-500]="notification.category === 'warning'" [class.bg-rose-500]="notification.category === 'error'"></span>
                <span class="flex min-w-0 flex-col gap-0.5">
                  <span class="text-xs font-bold text-zinc-900">{{ notification.title }}</span>
                  <span class="text-xs leading-5 text-zinc-700">{{ notification.content }}</span>
                  <span class="text-[11px] text-zinc-500">{{ notification.createdAt | date:'short' }}</span>
                </span>
              </button>
              <button
                type="button"
                class="absolute right-2 top-2 inline-flex h-6 w-6 items-center justify-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900"
                aria-label="Verwijder notificatie"
                (click)="onDeleteNotification($event, notification.id)"
              >
                <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
              </button>
            </li>
          }
        </ul>
      }
    </dialog>
  }
</div>
