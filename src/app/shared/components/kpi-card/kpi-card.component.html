<div class="flex flex-col gap-2 bg-white dark:bg-zinc-900 rounded-xl border border-zinc-100 dark:border-zinc-800 px-4 py-3">

  <span class="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider leading-none">
    {{ label() }}
  </span>

  @if (isLoading()) {
    <div class="h-7 w-20 rounded bg-zinc-100 dark:bg-zinc-800 animate-pulse" aria-busy="true"></div>
  } @else {
    <div class="flex items-end justify-between gap-2">
      <span class="text-[1.6rem] font-bold tracking-tight text-zinc-900 dark:text-white leading-none">
        {{ value() }}
      </span>
      @if (trend().length) {
        <div class="h-8 w-20 shrink-0">
          <shared-kpi-sparkline [points]="trend()" [isLoading]="isLoading()" class="h-full w-full" />
        </div>
      }
    </div>
    @if (hint()) {
      <span class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400 leading-none">{{ hint() }}</span>
    }
  }
</div>
