<!-- Card List Container -->
<ul
  class="flex flex-col divide-y divide-zinc-100 dark:divide-zinc-800 border-y border-zinc-100 dark:border-zinc-800"
  aria-label="Data cards"
>
  @for (row of rows(); track trackByRowId($index, row); let rowIndex = $index) {
    <li>
      <button
        type="button"
        class="group relative flex flex-col transition-colors duration-150 cursor-pointer focus:outline-hidden focus:bg-zinc-50 dark:focus:bg-zinc-800/50"
        [class]="getStatusClass(row) + ' ' + getBgClass(row)"
        [attr.aria-pressed]="row.selected ? 'true' : 'false'"
        (click)="onCardClick(rowIndex)"
        (keydown.enter)="onCardClick(rowIndex)"
      >
        <!-- Main Card Content (Horizontal Layout) -->
        <div class="flex items-center gap-4 p-3 font-sans">
          <!-- Avatar / Initials (Square) -->
          <div class="flex h-12 w-12 shrink-0 items-center justify-center bg-zinc-100 text-sm font-bold uppercase text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400">
            {{ getInitials(row) }}
          </div>

          <!-- Text Details -->
          <div class="flex min-w-0 flex-1 flex-col py-0.5">
            <div class="flex items-start justify-between">
              <p class="truncate text-base font-bold leading-tight text-zinc-900 dark:text-white pr-2">
                {{ getTitleText(row) }}
              </p>
              <span class="text-zinc-400 dark:text-zinc-600">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </span>
            </div>

            @if (getSubtitleText(row)) {
              <p class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">
                {{ getSubtitleText(row) }}
              </p>
            }

            @if (getSecondarySubtitleText(row)) {
              <p class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">
                {{ getSecondarySubtitleText(row) }}
              </p>
            }

            @if (getStatusText(row)) {
              <div class="mt-1.5 flex items-center gap-2">
                <shared-chip [variant]="getStatusVariant(row)">
                  {{ getStatusText(row) }}
                </shared-chip>
                
                @if (row.recentlyUpdated) {
                  <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse" aria-hidden="true"></span>
                }
              </div>
            }
          </div>
        </div>

        @if (row.error) {
          <div class="border-t border-red-200 bg-red-50 px-4 py-2 text-[10px] font-bold uppercase tracking-tight text-red-700 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-200">
            {{ row.error }}
          </div>
        }

        <!-- Edit bottom sheet -->
        <app-bottom-sheet
          [isOpen]="isEditing(rowIndex)"
          [title]="row.isNew ? 'New Record' : 'Edit Record'"
          (close)="closeEdit()"
        >
          <div class="flex flex-col gap-4 p-4">
            @if (editableColumns().length === 0) {
              <p class="text-sm text-zinc-500">No editable fields</p>
            } @else {
              @for (column of editableColumns(); track column.id) {
                <div class="flex flex-col gap-2">
                  @if (column.cellType === 'boolean') {
                    <shared-checkbox
                      [checked]="!!getCellValue(row, column)"
                      (checkedChange)="onCellValueChange(rowIndex, column, $event)"
                      [label]="column.header"
                    />
                  } @else if (column.cellType === 'select') {
                    <shared-select
                      [options]="column.selectOptions ?? []"
                      [value]="getInputValue(row, column)"
                      (valueChange)="onCellValueChange(rowIndex, column, $event)"
                      [label]="column.header"
                      placeholder="Select an option"
                    />
                  } @else if (column.cellType === 'color') {
                    <shared-color-picker
                      [value]="getInputString(row, column)"
                      (valueChange)="onCellValueChange(rowIndex, column, $event)"
                      [label]="column.header"
                      placeholder="#3B82F6"
                    />
                  } @else {
                    <shared-input
                      [type]="column.cellType === 'number' ? 'number' : 'text'"
                      [value]="getInputString(row, column)"
                      (valueChange)="onCellValueChange(rowIndex, column, $event)"
                      [label]="column.header"
                      placeholder="Enter value"
                    />
                  }
                </div>
              }
            }
            <shared-button (clicked)="closeEdit()">
              {{ row.isNew ? 'Create' : 'Save' }}
            </shared-button>
          </div>
        </app-bottom-sheet>
      </button>
    </li>
  }

  @if (rows().length === 0) {
    <div class="flex flex-col items-center justify-center border border-dashed border-zinc-200 p-12 text-zinc-300 dark:border-zinc-800">
      <span class="text-[10px] font-bold uppercase tracking-[0.2em]">No results</span>
    </div>
  }
</ul>
