<thead class="bg-zinc-50 border-b border-zinc-200">
  <tr role="row">
    <!-- Selection checkbox column -->
    @if (selectable()) {
      <th
        role="columnheader"
        scope="col"
        class="w-12 px-3 py-3 text-left"
      >
        <div class="flex items-center justify-center">
          <input
            #headerCheckbox
            type="checkbox"
            [checked]="allSelected()"
            [indeterminate]="partiallySelected()"
            (change)="onSelectAll()"
            class="w-4 h-4 accent-black cursor-pointer"
            aria-label="Select all rows"
          />
        </div>
      </th>
    }

    <!-- Data columns -->
    @for (column of columns(); track column.id) {
      <th
        role="columnheader"
        scope="col"
        [attr.aria-sort]="getSortDirection(column.id) === 'asc' ? 'ascending' : getSortDirection(column.id) === 'desc' ? 'descending' : null"
        class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-left text-zinc-600"
        [style.width]="column.width"
        [style.min-width]="column.minWidth"
        [style.max-width]="column.maxWidth"
        [class.text-center]="column.align === 'center'"
        [class.text-right]="column.align === 'right'"
      >
        @if (column.sortable) {
          <button
            type="button"
            (click)="onSort(column)"
            class="flex items-center gap-1.5 group focus:outline-none focus:underline"
            [attr.aria-label]="getSortAriaLabel(column)"
          >
            <span>{{ column.header }}</span>
            <span 
              class="flex items-center justify-center w-4 h-4 transition-opacity"
              [class.opacity-0]="!getSortDirection(column.id)"
              [class.group-hover:opacity-50]="!getSortDirection(column.id)"
              [class.opacity-100]="getSortDirection(column.id)"
              aria-hidden="true"
            >
              @if (getSortDirection(column.id) === 'asc') {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                </svg>
              } @else if (getSortDirection(column.id) === 'desc') {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              } @else {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
              }
            </span>
          </button>
        } @else {
          {{ column.header }}
        }
      </th>
    }

    <!-- Actions column placeholder -->
    <th
      role="columnheader"
      scope="col"
      class="w-20 px-3 py-3"
    >
      <span class="sr-only">Actions</span>
    </th>
  </tr>
</thead>
