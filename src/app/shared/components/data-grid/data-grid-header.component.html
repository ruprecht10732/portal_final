<thead class="bg-zinc-100 border-b-2 border-zinc-300 sticky top-0 z-10">
  <tr role="row">
    <!-- Selection checkbox column (always frozen if present) -->
    @if (selectable()) {
      <th
        role="columnheader"
        scope="col"
        class="w-12 px-2 py-2 sm:px-3 sm:py-3 text-left sticky left-0 z-20 bg-zinc-100"
      >
        <div class="flex items-center justify-center min-w-[44px] min-h-[44px]">
          <input
            #headerCheckbox
            type="checkbox"
            [checked]="allSelected()"
            [indeterminate]="partiallySelected()"
            [attr.aria-checked]="partiallySelected() ? 'mixed' : allSelected() ? 'true' : 'false'"
            (change)="onSelectAll()"
            class="w-5 h-5 accent-black cursor-pointer"
            aria-label="Select all rows"
          />
        </div>
      </th>
    }

    <!-- Data columns -->
    @for (column of columns(); track column.id; let colIndex = $index) {
      @let sortDirection = getSortDirection(column.id);
      <th
        role="columnheader"
        scope="col"
        [attr.aria-sort]="column.sortable ? (sortDirection === 'asc' ? 'ascending' : sortDirection === 'desc' ? 'descending' : 'none') : null"
        class="px-2 py-2 sm:px-4 sm:py-3 text-[11px] sm:text-xs font-bold uppercase tracking-wide sm:tracking-wider text-left text-zinc-800 sm:text-zinc-700"
        [class.sticky]="column.frozen"
        [class.z-20]="column.frozen"
        [class.bg-zinc-100]="column.frozen"
        [class.shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)]]="column.frozen"
        [style.width]="column.width"
        [style.min-width]="column.minWidth"
        [style.max-width]="column.maxWidth"
        [style.left]="column.frozen ? getFrozenColumnLeft(colIndex) : null"
        [class.text-center]="column.align === 'center'"
        [class.text-right]="column.align === 'right'"
      >
        @if (column.sortable) {
          <button
            type="button"
            (click)="onSort(column)"
            class="flex items-center justify-between gap-2 w-full min-h-[44px] min-w-[44px] focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
            [attr.aria-label]="getSortAriaLabel(column)"
          >
            <span class="truncate" [title]="column.header">{{ column.header }}</span>
            <span 
              class="flex items-center justify-center w-4 h-4 transition-opacity"
              [class.opacity-40]="!sortDirection"
              [class.opacity-100]="sortDirection"
              aria-hidden="true"
            >
              @if (sortDirection === 'asc') {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                </svg>
              } @else if (sortDirection === 'desc') {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              } @else {
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
              }
            </span>
          </button>
        } @else {
          <span class="block truncate" [title]="column.header">{{ column.header }}</span>
        }
      </th>
    }

    <!-- Actions column placeholder -->
    <th
      role="columnheader"
      scope="col"
      class="w-16 sm:w-20 px-2 py-2 sm:px-3 sm:py-3"
    >
      <span class="sr-only">Row actions</span>
    </th>
  </tr>
</thead>
