<!-- Backdrop -->
@if (isOpen()) {
  <div 
    class="fixed inset-0 bg-black/50 z-40 transition-opacity duration-300"
    [style.opacity]="backdropOpacity()"
    (click)="onBackdropClick()"
    aria-hidden="true"
  ></div>
}

<!-- Sheet Container -->
<div
  #sheet
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
  class="fixed inset-x-0 bottom-0 z-50 flex flex-col bg-white rounded-t-2xl shadow-2xl transition-transform"
  [class.duration-300]="isAnimating() || !isDragging()"
  [class.ease-out]="isAnimating() || !isDragging()"
  [style.transform]="transformStyle()"
  [style.max-height.vh]="maxHeight()"
  (touchstart)="onDragStart($event)"
  (touchmove)="onDragMove($event)"
  (touchend)="onDragEnd()"
>
  <!-- Drag Handle -->
  <div 
    class="flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing"
    (mousedown)="onDragStart($event)"
    (mousemove)="onDragMove($event)"
    (mouseup)="onDragEnd()"
    (mouseleave)="onDragEnd()"
  >
    <div class="w-10 h-1 bg-zinc-300 rounded-full"></div>
  </div>

  <!-- Header -->
  @if (title() || showCloseButton()) {
    <div class="flex items-center justify-between px-4 py-2 border-b border-zinc-100">
      <h2 class="text-base font-semibold text-zinc-900">
        {{ title() }}
      </h2>
      
      @if (showCloseButton()) {
        <button
          type="button"
          (click)="onCloseClick()"
          class="p-2 -mr-2 text-zinc-500 hover:text-zinc-900 transition-colors"
          aria-label="Close"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </div>
  }

  <!-- Content (scrollable) -->
  <div 
    class="flex-1 overflow-y-auto overscroll-contain"
    (scroll)="onContentScroll($event)"
  >
    <ng-content />
  </div>

  <!-- Footer slot -->
  <ng-content select="[bottomSheetFooter]" />
</div>
