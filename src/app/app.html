<main class="min-h-screen bg-zinc-50 flex flex-col p-4 sm:p-8">
  <div class="max-w-md w-full mx-auto space-y-12 py-12 text-left">
    <!-- Header -->
    <header class="space-y-2">
      <h1 class="text-3xl font-bold tracking-tighter uppercase italic">Portal</h1>
      <p class="text-zinc-500 text-sm font-medium uppercase tracking-widest">Minimalist Design System v21</p>
    </header>

    <shared-tabs>
      <div 
        role="tablist"
        class="flex border-b border-zinc-200 mb-8 overflow-x-auto no-scrollbar"
      >
        <button 
          type="button"
          role="tab"
          [attr.aria-selected]="activeTab() === 'profile'"
          [attr.aria-controls]="'panel-profile'"
          id="tab-profile"
          (click)="activeTab.set('profile')"
          class="px-6 py-4 text-xs font-bold uppercase tracking-widest border-b-2 transition-all duration-200 outline-none"
          [class.border-black]="activeTab() === 'profile'"
          [class.border-transparent]="activeTab() !== 'profile'"
          [class.text-black]="activeTab() === 'profile'"
          [class.text-zinc-400]="activeTab() !== 'profile'">
          Profile
        </button>
        <button 
          type="button"
          role="tab"
          [attr.aria-selected]="activeTab() === 'security'"
          [attr.aria-controls]="'panel-security'"
          id="tab-security"
          (click)="activeTab.set('security')"
          class="px-6 py-4 text-xs font-bold uppercase tracking-widest border-b-2 transition-all duration-200 outline-none"
          [class.border-black]="activeTab() === 'security'"
          [class.border-transparent]="activeTab() !== 'security'"
          [class.text-black]="activeTab() === 'security'"
          [class.text-zinc-400]="activeTab() !== 'security'">
          Security
        </button>
        <button 
          type="button"
          role="tab"
          [attr.aria-selected]="activeTab() === 'settings'"
          [attr.aria-controls]="'panel-settings'"
          id="tab-settings"
          (click)="activeTab.set('settings')"
          class="px-6 py-4 text-xs font-bold uppercase tracking-widest border-b-2 transition-all duration-200 outline-none"
          [class.border-black]="activeTab() === 'settings'"
          [class.border-transparent]="activeTab() !== 'settings'"
          [class.text-black]="activeTab() === 'settings'"
          [class.text-zinc-400]="activeTab() !== 'settings'">
          Settings
        </button>
      </div>

      <div 
        role="tabpanel" 
        id="panel-profile" 
        [attr.aria-labelledby]="'tab-profile'" 
        [hidden]="activeTab() !== 'profile'" 
        class="space-y-6"
      >
        <div class="bg-white p-8 border border-zinc-200 space-y-8">
          <div class="space-y-6 text-left">
            <shared-input 
              [(value)]="email" 
              label="Email Address" 
              placeholder="name@example.com"
              hint="We'll never share your email with anyone else."
              [required]="true"
            />

            <shared-select 
              [(value)]="country" 
              [options]="countryOptions" 
              label="Location"
              placeholder="Select your country"
            />

            <shared-multiselect
              [(value)]="resources"
              [options]="resourceOptions"
              label="Angular Resources"
              placeholder="Select topics"
              hint="Choose multiple topics to follow."
            />

            <shared-autocomplete
              [(value)]="framework"
              [options]="frameworkOptions"
              label="Framework"
              placeholder="Type to search"
              hint="Autocomplete uses Angular Aria combobox patterns."
            />

            <shared-calendar-grid [unavailableDates]="unavailableDates" />

            <shared-checkbox 
              [(checked)]="agreeToTerms" 
              label="I agree to the terms of service"
              hint="Privacy policy applies."
              [required]="true"
            />
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <shared-button variant="secondary" (clicked)="email.set(''); agreeToTerms.set(false)">
              Clear
            </shared-button>
            <shared-button [disabled]="!agreeToTerms()" (clicked)="activeTab.set('security')">
              Next Step
            </shared-button>
          </div>
        </div>
      </div>

      <div 
        role="tabpanel" 
        id="panel-security" 
        [attr.aria-labelledby]="'tab-security'" 
        [hidden]="activeTab() !== 'security'" 
        class="space-y-6"
      >
        <div class="bg-white p-8 border border-zinc-200 space-y-8">
          <shared-input 
            [(value)]="password" 
            label="Password" 
            type="password" 
            placeholder="••••••••"
            [error]="password().length > 0 && password().length < 8 ? 'Password must be at least 8 characters' : ''"
            [required]="true"
          />
          
          <shared-button [loading]="false" (clicked)="activeTab.set('settings')">
            Save Security
          </shared-button>
        </div>
      </div>

      <div 
        role="tabpanel" 
        id="panel-settings" 
        [attr.aria-labelledby]="'tab-settings'" 
        [hidden]="activeTab() !== 'settings'" 
        class="space-y-6"
      >
        <div class="bg-white p-8 border border-zinc-200 space-y-8">
          <shared-textarea 
            [(value)]="bio" 
            label="User Biography" 
            placeholder="Tell us about yourself..." 
            hint="Maximum 500 characters."
          />
          
          <p class="text-xs text-zinc-500 leading-relaxed uppercase tracking-tight">
            Review your minimalist setup. Everything is zero-radius, signal-driven, and aria-enhanced.
          </p>
          
          <shared-button variant="primary" (clicked)="activeTab.set('profile')" class="w-full">
            Back to Profile
          </shared-button>
        </div>
      </div>
    </shared-tabs>

    <!-- Footer Meta -->
    <footer class="pt-8 border-t border-zinc-200">
      <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-400">
        <span>Status: Production</span>
        <span>Aria Core Integrated</span>
      </div>
    </footer>
  </div>
</main>
