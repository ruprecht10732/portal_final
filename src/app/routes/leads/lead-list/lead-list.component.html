<shared-page-layout
  [title]="'leads.list.title' | translate"
  [subtitle]="'leads.list.subtitle' | translate"
  [error]="error()"
  [removeMobilePadding]="true"
>
  <div class="sm:hidden flex flex-wrap items-center gap-2 px-4 pt-4">
    <shared-button
      variant="primary"
      size="compact"
      [ariaLabel]="'leads.list.newLead' | translate"
      (clicked)="createLead()"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      {{ 'leads.list.newLead' | translate }}
    </shared-button>
  </div>

  <shared-fab-button
    class="hidden sm:flex"
    [ariaLabel]="'leads.list.newLead' | translate"
    (clicked)="createLead()"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    {{ 'leads.list.newLead' | translate }}
  </shared-fab-button>

  <shared-data-grid
    [columns]="columns()"
    [data]="leads()"
    [totalItems]="total()"
    [loading]="loading()"
    [config]="gridConfig()"
    [serverSide]="true"
    [fetchData]="fetchDataFn"
    (dataRequest)="onDataRequest($event)"
    (saveRows)="onSaveLeads($event)"
    (deleteRows)="onDeleteLeads($event)"
    (rowDoubleClick)="onLeadDoubleClick($event)"
    [ariaLabel]="'leads.list.ariaLabel' | translate"
  />

  <shared-confirm-dialog
    [isOpen]="isDeleteDialogOpen()"
    [title]="'leads.list.deleteTitle' | translate"
    [message]="'leads.list.deleteMessage' | translate:{count: deleteCount()}"
    [confirmText]="'leads.list.deleteConfirm' | translate"
    [cancelText]="'leads.list.deleteCancel' | translate"
    confirmVariant="danger"
    [confirmDisabled]="deleteInProgress()"
    (confirm)="confirmDelete()"
    (cancelled)="closeDeleteDialog()"
  />
</shared-page-layout>
