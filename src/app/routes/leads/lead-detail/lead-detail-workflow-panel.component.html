<div class="mb-4 rounded-lg border border-zinc-200 p-4">
  <shared-select
    [label]="'leads.detail.workflow.label' | translate"
    [options]="workflowOptions()"
    [value]="selectedWorkflowId()"
    (valueChange)="workflowSelectionChange.emit($event)"
    [placeholder]="'leads.detail.workflow.placeholder' | translate"
  />

  <div class="mt-3 flex flex-wrap gap-2">
    <shared-button
      variant="primary"
      [fullWidth]="false"
      [loading]="workflowSaving()"
      [disabled]="workflowSaving()"
      (clicked)="save.emit()"
    >
      {{ 'leads.detail.workflow.save' | translate }}
    </shared-button>
    <shared-button
      variant="ghost"
      [fullWidth]="false"
      [loading]="workflowSaving()"
      [disabled]="workflowSaving()"
      (clicked)="useDefault.emit()"
    >
      {{ 'leads.detail.workflow.useDefault' | translate }}
    </shared-button>
  </div>

  @if (workflowError()) {
    <p class="mt-2 text-sm text-red-600">{{ workflowError() }}</p>
  } @else {
    <p class="mt-2 text-xs text-zinc-500">
      {{ 'leads.detail.workflow.resolutionSource' | translate }}: {{ resolutionSource() || '-' }}
    </p>
  }
</div>
