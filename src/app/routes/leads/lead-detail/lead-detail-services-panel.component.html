<shared-lead-services-card
  [services]="services()"
  [selectedServiceId]="selectedServiceId()"
  [serviceTypeLabels]="serviceTypeLabels()"
  [statusLabels]="statusLabels()"
  [statusColors]="statusColors()"
  [showAddForm]="showAddForm()"
  [serviceTypeOptions]="serviceTypeOptions()"
  [newServiceType]="newServiceType()"
  [newServiceConsumerNote]="newServiceConsumerNote()"
  [newServiceSource]="newServiceSource()"
  [closeCurrentService]="closeCurrentService()"
  [saving]="saving()"
  (openAdd)="openAdd.emit()"
  (cancelAdd)="cancelAdd.emit()"
  (addService)="addService.emit()"
  (selectService)="selectService.emit($event)"
  (newServiceTypeChange)="newServiceTypeChange.emit($event)"
  (newServiceConsumerNoteChange)="newServiceConsumerNoteChange.emit($event)"
  (newServiceSourceChange)="newServiceSourceChange.emit($event)"
  (closeCurrentServiceChange)="closeCurrentServiceChange.emit($event)"
></shared-lead-services-card>
