<!-- Desktop: Inline action bar -->
<div class="hidden lg:flex items-center gap-2 p-3 bg-white/95 backdrop-blur-sm border border-zinc-200 rounded-xl">
  @if (phone()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-zinc-700 hover:text-zinc-900 hover:bg-zinc-100 rounded-lg transition-colors"
      (click)="handlePhoneClick()"
      [attr.aria-label]="'leads.detail.quickActions.call' | translate"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
      </svg>
      <span class="hidden xl:inline">{{ 'leads.detail.quickActions.call' | translate }}</span>
    </button>
  }

  @if (email()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-zinc-700 hover:text-zinc-900 hover:bg-zinc-100 rounded-lg transition-colors"
      (click)="handleEmailClick()"
      [attr.aria-label]="'leads.detail.quickActions.email' | translate"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
      </svg>
      <span class="hidden xl:inline">{{ 'leads.detail.quickActions.email' | translate }}</span>
    </button>
  }

  <div class="w-px h-6 bg-zinc-200" aria-hidden="true"></div>

  <button
    type="button"
    class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-zinc-700 hover:text-zinc-900 hover:bg-zinc-100 rounded-lg transition-colors"
    (click)="navigateClicked.emit()"
    [attr.aria-label]="'leads.detail.quickActions.navigate' | translate"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
    </svg>
    <span class="hidden xl:inline">{{ 'leads.detail.quickActions.navigate' | translate }}</span>
  </button>

  @if (hasSelectedService()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors"
      [disabled]="isProcessing()"
      (click)="logCallClicked.emit()"
    >
      @if (isProcessing()) {
        <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
      } @else {
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
        </svg>
      }
      <span>{{ 'leads.callLogger.openButton' | translate }}</span>
    </button>
  }

  @if (hasSelectedService()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-zinc-900 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors"
      (click)="quoteClicked.emit()"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
      </svg>
      <span>{{ 'leads.detail.createQuote' | translate }}</span>
    </button>
  }
</div>

<!-- Mobile: Floating action bar at bottom -->
<div class="lg:hidden fixed bottom-0 inset-x-0 z-30 p-3 pb-safe bg-white/95 backdrop-blur-sm border-t border-zinc-200">
  <div class="flex items-center justify-around gap-2">
    @if (phone()) {
      <button
        type="button"
        class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1 px-4 py-2 text-zinc-600 hover:text-zinc-900"
        (click)="handlePhoneClick()"
        [attr.aria-label]="'leads.detail.quickActions.call' | translate"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
        </svg>
        <span class="text-xs">{{ 'leads.detail.quickActions.call' | translate }}</span>
      </button>
    }

    @if (email()) {
      <button
        type="button"
        class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1 px-4 py-2 text-zinc-600 hover:text-zinc-900"
        (click)="handleEmailClick()"
        [attr.aria-label]="'leads.detail.quickActions.email' | translate"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
        </svg>
        <span class="text-xs">{{ 'leads.detail.quickActions.email' | translate }}</span>
      </button>
    }

    <button
      type="button"
      class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1 px-4 py-2 text-zinc-600 hover:text-zinc-900"
      (click)="navigateClicked.emit()"
      [attr.aria-label]="'leads.detail.quickActions.navigate' | translate"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
      </svg>
      <span class="text-xs">{{ 'leads.detail.quickActions.navigate' | translate }}</span>
    </button>

    @if (hasSelectedService()) {
      <button
        type="button"
        class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1 rounded-full bg-indigo-600 px-4 py-2 text-white shadow-md"
        [disabled]="isProcessing()"
        (click)="logCallClicked.emit()"
        [attr.aria-label]="'leads.detail.quickActions.logCall' | translate"
      >
        @if (isProcessing()) {
          <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        } @else {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
          </svg>
        }
        <span class="text-xs font-medium">{{ 'leads.detail.quickActions.logCall' | translate }}</span>
      </button>
    }

    @if (hasSelectedService()) {
      <button
        type="button"
        class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1 px-4 py-2 text-zinc-600 hover:text-zinc-900"
        (click)="quoteClicked.emit()"
        [attr.aria-label]="'leads.detail.quickActions.quote' | translate"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
        <span class="text-xs">{{ 'leads.detail.quickActions.quote' | translate }}</span>
      </button>
    }
  </div>
</div>
