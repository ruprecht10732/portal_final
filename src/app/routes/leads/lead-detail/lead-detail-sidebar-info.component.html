<section class="flex flex-col font-sans border border-slate-200 rounded-xl bg-white overflow-hidden">

  <div class="flex flex-col gap-4 p-5 border-b border-slate-100">
    <header class="flex items-center justify-between">
      <h2 class="text-sm font-semibold text-slate-900">
        {{ 'leads.detail.location' | translate }}
      </h2>
      
      <a
        class="group flex items-center gap-1.5 text-xs font-medium text-blue-600 hover:text-blue-700 transition-colors"
        [href]="mapUrl()"
        target="_blank"
        rel="noopener"
      >
        <span>{{ 'leads.detail.viewOnMaps' | translate }}</span>
        <svg class="h-3.5 w-3.5 opacity-70 group-hover:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
        </svg>
      </a>
    </header>

    <div class="relative overflow-hidden rounded-lg border border-slate-200 bg-slate-50">
      <shared-map-preview
        [address]="fullAddress()"
        [latitude]="latitude()"
        [longitude]="longitude()"
        [height]="160"
        class="block w-full mix-blend-multiply opacity-90 transition-opacity hover:opacity-100"
      ></shared-map-preview>
    </div>

    <div class="flex items-start justify-between gap-3">
      <p class="text-sm font-medium text-slate-700 leading-snug pt-1">
        {{ fullAddress() }}
      </p>
      
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-md border border-slate-200 text-slate-500 hover:border-slate-300 hover:text-slate-900 hover:bg-slate-50 active:bg-slate-100 transition-all"
        (click)="copyAddress.emit()"
        [title]="'leads.detail.copyAddress' | translate"
      >
        @if (copiedAddress()) {
          <svg class="h-4 w-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        } @else {
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" /></svg>
        }
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-4 p-5">
    <div class="flex flex-col gap-1">
      <h2 class="text-sm font-semibold text-slate-900">
        {{ 'leads.detail.contact' | translate }}
      </h2>
      <p class="text-sm text-slate-600">{{ fullName() }}</p>
    </div>

    <div class="text-sm text-slate-600">
      <shared-contact-info
        [phone]="phone()"
        [email]="email()"
        [role]="role()"
        [assignedTo]="assignedTo()"
      ></shared-contact-info>
    </div>

    @if (hasSelectedService()) {
      <div class="pt-2">
        <button
          class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm ring-1 ring-inset ring-slate-900 transition-all hover:bg-slate-800 active:scale-[0.99]"
          (click)="openCallLogger.emit()"
        >
          <svg class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
          {{ 'leads.callLogger.openButton' | translate }}
        </button>
      </div>
    }
  </div>

</section>
