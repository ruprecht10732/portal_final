<shared-page-layout
  [title]="'services.list.title' | translate"
  [subtitle]="'services.list.subtitle' | translate"
  [error]="error()"
>
  <shared-fab-button
    actions
    class="hidden sm:flex"
    [ariaLabel]="'services.list.newServiceType' | translate"
    (clicked)="goToCreate()"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    {{ 'services.list.newServiceType' | translate }}
  </shared-fab-button>

  <shared-data-grid
    [columns]="columns()"
    [data]="serviceTypes()"
    [totalItems]="total()"
    [loading]="loading() || saving()"
    [error]="error() || ''"
    [config]="gridConfig"
    [serverSide]="true"
    [fetchData]="fetchDataFn"
    (dataRequest)="onDataRequest($event)"
    (saveRows)="onSaveServiceTypes($event)"
    (deleteRows)="onDeleteRows($event)"
    (rowDoubleClick)="onServiceTypeDoubleClick($event)"
    [ariaLabel]="'services.list.ariaLabel' | translate"
  />

  <shared-confirm-dialog
    [isOpen]="isDeleteDialogOpen()"
    [title]="'services.list.deleteTitle' | translate"
    [message]="'services.list.deleteMessage' | translate:{count: deleteCount()}"
    [confirmText]="'services.list.deleteConfirm' | translate"
    [cancelText]="'services.list.deleteCancel' | translate"
    confirmVariant="danger"
    [confirmDisabled]="saving()"
    (confirm)="confirmDelete()"
    (cancelled)="closeDeleteDialog()"
  />
</shared-page-layout>
