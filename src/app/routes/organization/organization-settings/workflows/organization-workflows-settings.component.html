<shared-page-layout
  [title]="'organization.settings.workflows.title' | translate"
  [subtitle]="'organization.settings.workflows.subtitle' | translate"
  [error]="errorMessage()"
>
  @if (isLoading()) {
    <div class="mx-auto w-full max-w-4xl flex flex-col gap-6 py-6">
      <shared-skeleton height="12rem" width="100%" />
      <shared-skeleton height="12rem" width="100%" />
    </div>
  } @else {
    <div class="mx-auto w-full max-w-4xl flex flex-col gap-6 py-6">
      @for (card of cards; track card.trigger) {
        <shared-card>
          <h4 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-6">
            {{ card.titleKey | translate }}
          </h4>

          <div class="flex flex-col gap-4">
            <shared-checkbox
              [label]="'organization.settings.workflows.enabled' | translate"
              [checked]="workflows()[card.trigger].enabled"
              (checkedChange)="updateEnabled(card.trigger, $event)"
            />

            <shared-number-input
              [label]="'organization.settings.workflows.delayLabel' | translate"
              [hint]="card.hintKey | translate"
              [value]="workflows()[card.trigger].delayMinutes"
              (valueChange)="updateDelay(card.trigger, $event)"
              [min]="0"
              [max]="1440"
              [step]="1"
              suffix="min"
            />

            @if (card.supportsLeadSource) {
              <shared-input
                [label]="'organization.settings.workflows.leadSourceLabel' | translate"
                [hint]="'organization.settings.workflows.leadSourceHint' | translate"
                [value]="workflows()[card.trigger].leadSource"
                (valueChange)="updateLeadSource(card.trigger, $event)"
                [placeholder]="'organization.settings.workflows.leadSourcePlaceholder' | translate"
              />
            }

            <shared-textarea
              [label]="'organization.settings.workflows.templateLabel' | translate"
              [hint]="card.varsKey | translate"
              [value]="workflows()[card.trigger].templateText"
              (valueChange)="updateTemplate(card.trigger, $event)"
              [rows]="6"
              [placeholder]="'organization.settings.workflows.templatePlaceholder' | translate"
            />
          </div>
        </shared-card>
      }

      <shared-card>
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          <div>
            @if (successMessage()) {
              <p class="text-sm font-bold text-emerald-600 flex items-center gap-2">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
                {{ successMessage() }}
              </p>
            }
          </div>

          <shared-button
            variant="primary"
            [disabled]="!canSave() || isSaving()"
            [loading]="isSaving()"
            [fullWidth]="false"
            (clicked)="save()"
          >
            {{ 'organization.settings.save' | translate }}
          </shared-button>
        </div>
      </shared-card>
    </div>
  }
</shared-page-layout>
