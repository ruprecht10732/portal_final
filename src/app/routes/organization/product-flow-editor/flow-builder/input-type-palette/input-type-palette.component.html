<div class="border border-blue-200 rounded-lg bg-blue-50/50 p-3 space-y-3">
  <span class="text-xs font-semibold text-blue-700 uppercase tracking-wider">Kies een invoertype</span>
  @for (cat of categories; track cat.id) {
    <div>
      <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider flex items-center gap-1 mb-1.5">
        <span>{{ cat.icon }}</span> {{ cat.label }}
      </span>
      <div class="grid grid-cols-1 gap-1">
        @for (ft of getTypesByCategory(cat.id); track ft.value) {
          <button
            type="button"
            class="flex items-center gap-2 px-2 py-1.5 rounded text-left text-xs bg-white border border-zinc-200 hover:border-blue-400 hover:bg-blue-50 transition-all group"
            (click)="selectType.emit(ft.value)">
            <span class="text-base leading-none w-5 text-center">{{ ft.icon }}</span>
            <div class="min-w-0">
              <div class="font-medium text-zinc-800 group-hover:text-blue-700 truncate">{{ ft.label }}</div>
              <div class="text-[10px] text-zinc-400 leading-tight truncate">{{ ft.description }}</div>
            </div>
          </button>
        }
      </div>
    </div>
  }
</div>
