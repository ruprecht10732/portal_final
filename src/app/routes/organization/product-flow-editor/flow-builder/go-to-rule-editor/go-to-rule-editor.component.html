<div class="border border-zinc-200 rounded-lg p-3 bg-white space-y-3">
  <div class="flex items-center justify-between">
    <span class="text-xs font-medium text-zinc-600">Ga-naar regel</span>
    <button type="button" class="text-zinc-400 hover:text-red-500 text-xs" (click)="remove.emit()">✕</button>
  </div>

  <!-- Label -->
  <div>
    <label class="block text-xs font-medium text-zinc-500 mb-1">Beschrijving (optioneel)</label>
    <input type="text" [ngModel]="rule().label ?? ''"
      (ngModelChange)="updateLabel($event)"
      class="w-full px-2 py-1.5 text-sm border border-zinc-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none"
      placeholder="bijv. Als buitendeur, ga naar meting" />
  </div>

  <!-- Condition -->
  <app-condition-editor
    [condition]="rule().condition"
    (conditionChange)="updateCondition($event)"
    label="Wanneer"
    [allowNull]="false"
    [draftFieldSuggestions]="draftFieldSuggestions()" />

  <!-- Target step -->
  <div>
    <label class="block text-xs font-medium text-zinc-500 mb-1">Ga naar stap</label>
    <select [ngModel]="rule().targetStepId"
      (ngModelChange)="updateTargetStepId($event)"
      class="w-full px-2 py-1.5 text-sm border border-zinc-300 rounded focus:ring-1 focus:ring-blue-500 outline-none">
      <option value="">-- Kies een stap --</option>
      @for (step of availableTargets(); track step.id) {
        <option [value]="step.id">{{ step.title || step.id }}</option>
      }
    </select>
  </div>
</div>
