<section class="rounded-xl border border-zinc-200 bg-white p-5">
  <div class="flex items-center justify-between gap-3 mb-3">
    <h3 class="text-sm font-semibold text-black uppercase tracking-wide">
      {{ titleKey() | translate }}
    </h3>
    <div class="flex items-center gap-2">
      <shared-button
        type="button"
        variant="ghost"
        size="compact"
        [iconOnly]="true"
        [fullWidth]="false"
        [disabled]="!whatsappUrl()"
        [ariaLabel]="'partners.detail.contactWhatsapp' | translate"
        [tooltip]="'partners.detail.contactWhatsapp' | translate"
        (clicked)="openWhatsApp.emit()"
      >
        <lucide-icon name="send" class="h-4 w-4" aria-hidden="true"></lucide-icon>
      </shared-button>
      <shared-button
        type="button"
        variant="ghost"
        size="compact"
        [iconOnly]="true"
        [fullWidth]="false"
        [disabled]="!phoneUrl()"
        [ariaLabel]="'partners.detail.contactCall' | translate"
        [tooltip]="'partners.detail.contactCall' | translate"
        (clicked)="openCall.emit()"
      >
        <lucide-icon name="phone" class="h-4 w-4" aria-hidden="true"></lucide-icon>
      </shared-button>
      <shared-button
        type="button"
        variant="ghost"
        size="compact"
        [iconOnly]="true"
        [fullWidth]="false"
        [disabled]="!emailUrl()"
        [ariaLabel]="'partners.detail.contactEmail' | translate"
        [tooltip]="'partners.detail.contactEmail' | translate"
        (clicked)="openEmail.emit()"
      >
        <lucide-icon name="mail" class="h-4 w-4" aria-hidden="true"></lucide-icon>
      </shared-button>
    </div>
  </div>
  <div class="divide-y divide-zinc-100">
    @for (row of rows(); track row.key) {
      <app-partner-detail-edit-row
        [labelKey]="row.labelKey"
        [value]="row.value"
        [formatAsPhone]="row.formatAsPhone ?? false"
        [editable]="true"
        [isEditing]="editingKey() === row.key"
        [editValue]="editValue()"
        (startEdit)="startEdit.emit(row.key)"
        (cancelEdit)="cancelEdit.emit()"
        (saveEdit)="saveEdit.emit(row.key)"
        (editValueChange)="editValueChange.emit($event)"
      />
    }
  </div>
</section>
