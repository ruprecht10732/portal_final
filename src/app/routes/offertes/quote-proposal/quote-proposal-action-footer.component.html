@if (!isFinalized() && !isReadOnly()) {
  @if (variant() === 'mobile') {
    <div class="fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200/40 bg-white/70 px-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] pt-4 backdrop-blur-xl">
      <div class="mx-auto flex max-w-md flex-col gap-2.5">
        <button
          type="button"
          class="flex h-14 w-full items-center justify-center gap-2 rounded-full bg-blue-600 text-[15px] font-extrabold text-white shadow-lg shadow-blue-600/25 transition-transform active:scale-[0.98] active:bg-blue-700"
          (click)="accept.emit()"
          [disabled]="accepting()"
        >
          <lucide-icon name="pencil" class="h-4 w-4" aria-hidden="true"></lucide-icon>
          <span>{{ 'offertes.proposal.acceptAndSign' | translate }}</span>
        </button>
        <!-- Ghost button style for reject ensures maximum focus on accept -->
        <button
          type="button"
          class="h-12 w-full rounded-full bg-transparent text-[14px] font-bold text-slate-500 transition-colors active:bg-slate-100"
          (click)="reject.emit()"
          [disabled]="rejecting()"
        >
          {{ 'offertes.proposal.reject' | translate }}
        </button>
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-xl border border-red-200 bg-white px-6 py-3 text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
        (click)="reject.emit()"
        [disabled]="rejecting()"
      >
        {{ 'offertes.proposal.reject' | translate }}
      </button>
      <button
        type="button"
        class="rounded-xl bg-green-600 px-8 py-3 text-sm font-medium text-white shadow-sm transition-colors hover:bg-green-700"
        (click)="accept.emit()"
        [disabled]="accepting()"
      >
        {{ 'offertes.proposal.acceptAndSign' | translate }}
      </button>
    </div>
  }
}
