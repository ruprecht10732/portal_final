@if (!isFinalized() && !isReadOnly()) {
  @if (variant() === 'mobile') {
    <div class="fixed bottom-0 left-0 right-0 z-50 border-t border-gray-100 bg-white/80 px-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] pt-5 backdrop-blur">
      <div class="mx-auto flex max-w-md flex-col gap-3">
        <button
          type="button"
          class="flex h-16 w-full items-center justify-center gap-2 rounded-[20px] bg-blue-600 text-lg font-extrabold text-white shadow-xl shadow-blue-500/25 transition-all active:scale-[0.97] active:bg-blue-700"
          (click)="accept.emit()"
          [disabled]="accepting()"
        >
          <lucide-icon name="pencil" class="h-5 w-5" aria-hidden="true"></lucide-icon>
          <span>Accepteren & Ondertekenen</span>
        </button>
        <button
          type="button"
          class="h-14 w-full rounded-[20px] border-2 border-slate-100 text-base font-bold text-slate-400 transition-all active:scale-[0.97]"
          (click)="reject.emit()"
          [disabled]="rejecting()"
        >
          Afwijzen
        </button>
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-xl border border-red-200 bg-white px-6 py-3 text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
        (click)="reject.emit()"
        [disabled]="rejecting()"
      >
        Afwijzen
      </button>
      <button
        type="button"
        class="rounded-xl bg-green-600 px-8 py-3 text-sm font-medium text-white shadow-sm transition-colors hover:bg-green-700"
        (click)="accept.emit()"
        [disabled]="accepting()"
      >
        Accepteren & Ondertekenen
      </button>
    </div>
  }
}
