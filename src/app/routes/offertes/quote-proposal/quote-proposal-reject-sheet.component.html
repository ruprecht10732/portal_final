<app-bottom-sheet
  [isOpen]="isOpen()"
  [title]="'offertes.proposal.rejectSheetTitle' | translate"
  (closed)="requestDismiss.emit()"
>
  <div class="mx-auto w-full max-w-md">
    <div class="px-6 pb-6 pt-4">
    <p class="text-sm text-zinc-500">
      {{ 'offertes.proposal.rejectSheetBody' | translate }}
    </p>
    <div class="mt-4">
      <label for="rejectReason" class="block text-xs font-bold uppercase tracking-widest text-zinc-400">{{ 'offertes.proposal.rejectSheetReasonLabel' | translate }}</label>
      <textarea
        id="rejectReason"
        rows="3"
        class="mt-2 w-full rounded-2xl border border-zinc-200 bg-zinc-50 px-4 py-3 text-sm text-zinc-700 placeholder:text-zinc-400 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20"
        [placeholder]="'offertes.proposal.rejectSheetPlaceholder' | translate"
        [value]="reason()"
        (input)="reasonChange.emit($any($event.target).value)"
      ></textarea>
    </div>
  </div>

  <div bottomSheetFooter class="border-t border-zinc-100 bg-white/90 px-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-4 backdrop-blur">
    <div class="flex flex-col gap-3">
      <button
        type="button"
        class="h-14 w-full rounded-[18px] bg-red-600 text-base font-extrabold text-white shadow-lg shadow-red-500/20 transition-transform active:scale-[0.98]"
        (click)="requestConfirm.emit()"
        [disabled]="rejecting()"
      >
        @if (rejecting()) {
          <span class="flex items-center justify-center gap-2">
            <div class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></div>
            {{ 'offertes.proposal.rejectSheetWorking' | translate }}
          </span>
        } @else {
          {{ 'offertes.proposal.reject' | translate }}
        }
      </button>
      <button
        type="button"
        class="h-12 w-full rounded-[18px] border border-zinc-200 text-sm font-semibold text-zinc-500"
        (click)="requestDismiss.emit()"
      >
        {{ 'common.cancel' | translate }}
      </button>
    </div>
  </div>
  </div>
</app-bottom-sheet>
