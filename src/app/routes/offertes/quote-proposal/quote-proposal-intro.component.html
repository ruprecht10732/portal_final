<section class="quote-intro">
  <button class="intro-skip" type="button" (click)="requestContinue()">{{ 'offertes.proposal.intro.skip' | translate }}</button>

  <button
    class="intro-scene"
    id="intro-trigger"
    type="button"
    [attr.aria-label]="'offertes.proposal.intro.revealAriaLabel' | translate"
    (click)="toggleIntro()"
  >
    <div class="intro-envelope" id="intro-envelope">
      <div class="intro-lid" id="intro-lid"></div>
      <div class="intro-inner-shadow"></div>
      <div class="intro-pocket"></div>
      <div class="intro-bottom-flap"></div>
      <div class="intro-seal" id="intro-seal">
        <span>{{ customerInitial }}</span>
      </div>
    </div>

    <div class="intro-letter" id="intro-letter">
      <div class="intro-letter-shine" id="intro-shine"></div>
      <div class="intro-letter-eyebrow">{{ 'offertes.proposal.intro.eyebrow' | translate }}</div>
      <h1>{{ 'offertes.proposal.intro.title' | translate }}</h1>
      <div class="intro-letter-divider"></div>
      <p>
        @if (customerName) {
          {{ 'offertes.proposal.intro.greetingWithName' | translate:{name: customerName} }}
        } @else {
          {{ 'offertes.proposal.intro.greeting' | translate }}
        }
        <span>{{ 'offertes.proposal.intro.thanks' | translate }}</span>
        <span>{{ 'offertes.proposal.intro.prepared' | translate }}</span>
      </p>
      <div class="intro-letter-signature">{{ organizationName ?? '' }}</div>
      <div class="intro-letter-footer">{{ 'offertes.proposal.intro.footer' | translate }}</div>
    </div>

    <div class="intro-ground-shadow" id="intro-shadow"></div>
  </button>

  <div class="intro-hint" [class.is-visible]="!introOpen()" [class.is-open]="introOpen()">
    {{ 'offertes.proposal.intro.hint' | translate }}
  </div>
  @if (introOpen()) {
    <button class="intro-continue" type="button" (click)="requestContinue()">{{ 'offertes.proposal.intro.continue' | translate }}</button>
  }
</section>
