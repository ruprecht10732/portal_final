<section class="quote-intro">
  <button class="intro-skip" type="button" (click)="requestContinue()">Overslaan</button>

  <button
    class="intro-scene"
    id="intro-trigger"
    type="button"
    aria-label="Offerte onthullen"
    (click)="toggleIntro()"
  >
    <div class="intro-envelope" id="intro-envelope">
      <div class="intro-lid" id="intro-lid"></div>
      <div class="intro-inner-shadow"></div>
      <div class="intro-pocket"></div>
      <div class="intro-bottom-flap"></div>
      <div class="intro-seal" id="intro-seal">
        <span>{{ customerInitial }}</span>
      </div>
    </div>

    <div class="intro-letter" id="intro-letter">
      <div class="intro-letter-shine" id="intro-shine"></div>
      <div class="intro-letter-eyebrow">Persoonlijk voorstel</div>
      <h1>Uw Offerte</h1>
      <div class="intro-letter-divider"></div>
      <p>
        Beste @if (customerName) { {{ customerName }} },
        <span>hartelijk dank voor uw vertrouwen.</span>
        <span>Wij hebben met zorg een offerte voor u samengesteld.</span>
      </p>
      <div class="intro-letter-signature">{{ organizationName ?? '' }}</div>
      <div class="intro-letter-footer">Bekijk uw offerte hieronder</div>
    </div>

    <div class="intro-ground-shadow" id="intro-shadow"></div>
  </button>

  <div class="intro-hint" [class.is-visible]="!introOpen()" [class.is-open]="introOpen()">{{ introHint() }}</div>
  @if (introOpen()) {
    <button class="intro-continue" type="button" (click)="requestContinue()">Bekijk offerte</button>
  }
</section>
