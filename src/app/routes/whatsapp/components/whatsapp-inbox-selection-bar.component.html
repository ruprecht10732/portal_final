<div class="pointer-events-none absolute inset-x-0 bottom-28 z-20 flex justify-center px-3 sm:bottom-36 sm:px-6">
  <div class="pointer-events-auto w-full max-w-3xl rounded-[1.5rem] border border-zinc-200 bg-white/95 px-3 py-3 shadow-xl backdrop-blur sm:px-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] font-black uppercase tracking-[0.18em] text-zinc-700">Selectiemodus</p>
        <p class="mt-1 text-sm font-semibold text-zinc-900">
          {{ selectedCount() }} bericht{{ selectedCount() === 1 ? '' : 'en' }} geselecteerd
        </p>
        <p class="mt-1 text-xs text-zinc-600">Kies welke berichten je als leadcontext wilt opslaan.</p>
      </div>

      @if (showLinkedLeadServicePicker()) {
        <div class="sm:min-w-[16rem] sm:max-w-[18rem] sm:flex-1">
          <shared-select
            [label]="'Leadservice voor opslaan'"
            [options]="linkedLeadServiceOptions()"
            [value]="linkedLeadServiceId()"
            (valueChange)="linkedLeadServiceIdChange.emit($event)"
            [disabled]="serviceSelectDisabled()"
          />
        </div>
      }

      <div class="flex flex-wrap items-center gap-2 sm:justify-end">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full border border-zinc-300 px-3 py-2 text-xs font-semibold text-zinc-700 transition hover:bg-zinc-50"
          [disabled]="savingImportantMessages()"
          (click)="cancelSelection.emit()"
        >
          <lucide-icon name="x" class="h-3.5 w-3.5"></lucide-icon>
          Stop selectie
        </button>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full bg-emerald-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-emerald-300"
          [disabled]="selectedCount() === 0 || savingImportantMessages()"
          (click)="saveSelection.emit()"
        >
          @if (savingImportantMessages()) {
            <lucide-icon name="loader-circle" class="h-3.5 w-3.5 animate-spin"></lucide-icon>
          } @else {
            <lucide-icon name="bookmark-plus" class="h-3.5 w-3.5"></lucide-icon>
          }
          Opslaan bij lead
        </button>
      </div>
    </div>
  </div>
</div>
