<main class="min-h-screen bg-zinc-50 flex flex-col">
  <header class="border-b border-zinc-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a routerLink="/app" class="space-y-1">
          <p class="text-[10px] uppercase tracking-[0.35em] text-zinc-400 font-semibold">Portal</p>
          <h1 class="text-lg font-bold uppercase tracking-tight">Dashboard</h1>
        </a>
        
        <!-- Desktop Nav -->
        <nav class="hidden sm:flex items-center gap-1">
          <a
            routerLink="/app"
            routerLinkActive="bg-zinc-100 text-black"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-2 text-sm font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
          >
            Home
          </a>
          <a
            routerLink="/app/leads"
            routerLinkActive="bg-zinc-100 text-black"
            class="px-3 py-2 text-sm font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
          >
            Leads
          </a>
        </nav>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Mobile menu button -->
        <button
          type="button"
          class="sm:hidden p-2 text-zinc-500 hover:text-black hover:bg-zinc-100 transition-colors"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Toggle menu"
        >
          @if (mobileMenuOpen()) {
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          }
        </button>
        
        <shared-button class="hidden sm:block" variant="secondary" size="compact" routerLink="/sign-in" ariaLabel="Sign out">
          Sign out
        </shared-button>
      </div>
    </div>
    
    <!-- Mobile Nav -->
    @if (mobileMenuOpen()) {
      <nav class="sm:hidden border-t border-zinc-100 bg-white">
        <a
          routerLink="/app"
          routerLinkActive="bg-zinc-100 text-black font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
          class="block px-4 py-3 text-sm text-zinc-600 hover:bg-zinc-50 border-b border-zinc-100"
        >
          Home
        </a>
        <a
          routerLink="/app/leads"
          routerLinkActive="bg-zinc-100 text-black font-semibold"
          (click)="closeMobileMenu()"
          class="block px-4 py-3 text-sm text-zinc-600 hover:bg-zinc-50 border-b border-zinc-100"
        >
          Leads
        </a>
        <a
          routerLink="/sign-in"
          (click)="closeMobileMenu()"
          class="block px-4 py-3 text-sm text-red-600 hover:bg-red-50"
        >
          Sign out
        </a>
      </nav>
    }
  </header>

  <section class="flex-1">
    <router-outlet />
  </section>

  @if (showTimeoutWarning()) {
    <dialog open class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-white border border-zinc-200 p-6 space-y-4">
        <h2 class="text-xl font-bold uppercase tracking-tight">Session expiring</h2>
        <p class="text-sm text-zinc-500">Your session is about to expire due to inactivity.</p>
        <div class="grid grid-cols-2 gap-3">
          <shared-button variant="secondary" (clicked)="closeTimeoutWarning()" ariaLabel="Stay signed in">
            Stay signed in
          </shared-button>
          <shared-button variant="danger" routerLink="/sign-in" ariaLabel="Sign out now">
            Sign out
          </shared-button>
        </div>
      </div>
    </dialog>
  }
</main>
