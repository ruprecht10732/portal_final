<main class="h-screen overflow-hidden bg-zinc-50">
  <div class="flex h-full">
    <!-- Desktop sidebar -->
    <div class="hidden lg:flex">
      <app-authenticated-sidebar></app-authenticated-sidebar>
    </div>

    <!-- Main content area -->
    <div class="flex h-full flex-1 flex-col pb-16 lg:py-4 lg:pr-4 lg:pb-4 min-w-0">
      <div class="flex min-h-0 flex-1 flex-col min-w-0">
        <section class="flex-1 overflow-y-auto overflow-x-hidden min-w-0">
          <app-mobile-section-tabs></app-mobile-section-tabs>
          <router-outlet />
        </section>
      </div>
    </div>
  </div>

  <!-- Mobile bottom navigation -->
  <app-authenticated-mobile-nav></app-authenticated-mobile-nav>

  <shared-toast-container></shared-toast-container>

  @if (showTimeoutWarning()) {
    <dialog open class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-white border border-zinc-200 p-6 space-y-4">
        <h2 class="text-xl font-bold uppercase tracking-tight">Session expiring</h2>
        <p class="text-sm text-zinc-500">Your session is about to expire due to inactivity.</p>
        <div class="grid grid-cols-2 gap-3">
          <shared-button variant="secondary" (clicked)="closeTimeoutWarning()" ariaLabel="Stay signed in">
            Stay signed in
          </shared-button>
          <shared-button variant="danger" routerLink="/sign-in" ariaLabel="Sign out now">
            Sign out
          </shared-button>
        </div>
      </div>
    </dialog>
  }
</main>
