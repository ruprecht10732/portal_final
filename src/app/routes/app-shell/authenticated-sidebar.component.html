<div class="flex h-full">
  <aside class="flex h-full w-20 flex-col items-center border border-zinc-200 bg-zinc-100 px-2 py-6">
    <div class="mb-8 flex w-full items-center justify-center">
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-zinc-900 text-sm font-semibold text-white">
        PF
      </div>
    </div>

    <nav class="no-scrollbar flex flex-1 flex-col items-center gap-4 overflow-y-auto" [attr.aria-label]="'sidebar.primary' | translate">
      @for (item of items(); track item.route) {
        <shared-button
          class="sidebar-item"
          [routerLink]="item.route"
          routerLinkActive
          #activeLink="routerLinkActive"
          [variant]="activeLink.isActive ? 'primary' : 'ghost'"
          size="compact"
          [iconOnly]="true"
          shape="square"
          [fullWidth]="false"
          [ariaLabel]="item.label | translate"
          [attr.title]="item.label | translate"
          [tooltip]="item.label | translate"
        >
          @switch (item.icon) {
            @case ('dashboard') {
              <lucide-icon name="layout-dashboard" class="h-5 w-5"></lucide-icon>
            }
            @case ('leads') {
              <lucide-icon name="users" class="h-5 w-5"></lucide-icon>
            }
            @case ('services') {
              <lucide-icon name="wrench" class="h-5 w-5"></lucide-icon>
            }
            @case ('profile') {
              <lucide-icon name="user" class="h-5 w-5"></lucide-icon>
            }
          }
        </shared-button>
      }
    </nav>

    <div class="mt-6 flex flex-col items-center gap-4 border-t border-zinc-100 pt-6">
      <shared-button
        class="sidebar-toggle"
        variant="ghost"
        size="compact"
        [iconOnly]="true"
        shape="square"
        [fullWidth]="false"
        [ariaLabel]="isExpanded() ? ('sidebar.collapse' | translate) : ('sidebar.expand' | translate)"
        [tooltip]="isExpanded() ? ('sidebar.collapse' | translate) : ('sidebar.expand' | translate)"
        (clicked)="toggleExpanded()"
      >
        <lucide-icon name="arrow-left-right" class="h-5 w-5"></lucide-icon>
      </shared-button>
      <shared-menu
        triggerLabel="navigation.profile"
        ariaLabel="navigation.profile"
        [iconOnly]="true"
        [showChevron]="false"
        [triggerVariant]="'ghost'"
        [triggerSize]="'compact'"
        [triggerShape]="'square'"
        [fullWidth]="false"
        [sections]="profileMenu"
        [tooltip]="'navigation.profile' | translate"
      >
        <lucide-icon menuTrigger name="user" class="h-6 w-6"></lucide-icon>
      </shared-menu>
    </div>
  </aside>

  @if (isExpanded()) {
    <app-authenticated-sidebar-panel
      [title]="activeTitle()"
      [items]="panelItems()"
    ></app-authenticated-sidebar-panel>
  }
</div>
