<div class="flex h-full">
  <aside class="flex h-full w-20 flex-col items-center border border-zinc-200 bg-zinc-100 px-2 py-6">
    <div class="mb-8 flex w-full items-center justify-center">
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-zinc-900 text-sm font-semibold text-white">
        PF
      </div>
    </div>

    <nav class="no-scrollbar flex flex-1 flex-col items-center gap-4 overflow-y-auto" aria-label="Primary">
      @for (item of items; track item.route) {
        <div class="group relative">
          <shared-button
            class="sidebar-item"
            [routerLink]="item.route"
            routerLinkActive
            #activeLink="routerLinkActive"
            [variant]="activeLink.isActive ? 'primary' : 'ghost'"
            size="compact"
            [iconOnly]="true"
            [fullWidth]="false"
            [ariaLabel]="item.label"
          >
            @switch (item.icon) {
              @case ('dashboard') {
                <lucide-icon name="layout-dashboard" class="h-5 w-5"></lucide-icon>
              }
              @case ('leads') {
                <lucide-icon name="users" class="h-5 w-5"></lucide-icon>
              }
            }
          </shared-button>
          <span class="pointer-events-none absolute left-16 rounded bg-zinc-900 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100">
            {{ item.label }}
          </span>
        </div>
      }
    </nav>

    <div class="mt-6 flex flex-col items-center gap-4 border-t border-zinc-100 pt-6">
      <shared-button
        class="sidebar-toggle"
        variant="ghost"
        size="compact"
        [iconOnly]="true"
        [fullWidth]="false"
        [ariaLabel]="isExpanded() ? 'Collapse sidebar' : 'Expand sidebar'"
        (clicked)="toggleExpanded()"
      >
        <lucide-icon name="arrow-left-right" class="h-5 w-5"></lucide-icon>
      </shared-button>
      <shared-menu
        triggerLabel="Profile"
        ariaLabel="Profile"
        [iconOnly]="true"
        [showChevron]="false"
        [triggerVariant]="'ghost'"
        [triggerSize]="'compact'"
        [fullWidth]="false"
        [sections]="profileMenu"
      >
        <lucide-icon menuTrigger name="user" class="h-6 w-6"></lucide-icon>
      </shared-menu>
    </div>
  </aside>

  @if (isExpanded()) {
    <section class="h-full w-64 border border-zinc-200 border-l-0 bg-white px-5 py-6">
      <div class="text-xs font-semibold uppercase tracking-[0.32em] text-zinc-400">Current</div>
      <div class="mt-2 text-lg font-semibold text-zinc-900">
        {{ activeTitle() }}
      </div>
      @if (isLeadsRoute()) {
        <nav class="mt-6 flex flex-col gap-2" aria-label="Leads">
          <a
            [routerLink]="'/app/leads'"
            routerLinkActive
            #leadOverviewActive="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2 text-sm font-medium text-zinc-700 transition-colors hover:text-zinc-900"
            [class.text-zinc-900]="leadOverviewActive.isActive"
            [class.font-semibold]="leadOverviewActive.isActive"
          >
            <lucide-icon name="list" class="h-4 w-4"></lucide-icon>
            Lead overview
          </a>
          <a
            [routerLink]="'/app/leads/new'"
            routerLinkActive
            #leadCreateActive="routerLinkActive"
            class="flex items-center gap-2 text-sm font-medium text-zinc-700 transition-colors hover:text-zinc-900"
            [class.text-zinc-900]="leadCreateActive.isActive"
            [class.font-semibold]="leadCreateActive.isActive"
          >
            <lucide-icon name="plus" class="h-4 w-4"></lucide-icon>
            Create lead
          </a>
        </nav>
      }
    </section>
  }
</div>
