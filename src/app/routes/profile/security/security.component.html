<!-- Error Message: Edge-to-edge on mobile, card-style on desktop -->
@if (errorMessage()) {
  <div class="border-y border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 mb-6 sm:border sm:rounded-sm">
    {{ errorMessage() }}
  </div>
}

<!-- Section: No padding/border on mobile, card style starts at 'sm' -->
<section class="w-full space-y-6 bg-transparent border-none p-0 sm:bg-white sm:border sm:border-zinc-200 sm:p-6 sm:rounded-sm">
  
  <div class="space-y-1">
    <h3 class="text-lg font-semibold text-zinc-900">{{ 'profile.securityPage.title' | translate }}</h3>
    <p class="text-sm text-zinc-500">{{ 'profile.securityPage.subtitle' | translate }}</p>
  </div>

  <div class="grid gap-5">
    <shared-input
      [label]="'profile.securityPage.currentPassword' | translate"
      type="password"
      [value]="currentPassword()"
      (valueChange)="currentPassword.set($event)"
      [required]="true"
      [passwordToggle]="true"
    />
    <shared-input
      [label]="'profile.securityPage.newPassword' | translate"
      type="password"
      [value]="newPassword()"
      (valueChange)="newPassword.set($event)"
      [error]="newPasswordError()"
      [required]="true"
      [passwordToggle]="true"
    />
    <shared-input
      [label]="'profile.securityPage.confirmNewPassword' | translate"
      type="password"
      [value]="confirmPassword()"
      (valueChange)="confirmPassword.set($event)"
      [error]="confirmPasswordError()"
      [required]="true"
      [passwordToggle]="true"
    />
  </div>

  <div class="flex flex-col sm:flex-row sm:justify-end">
    <shared-button
      class="w-full sm:w-auto"
      variant="primary"
      size="compact"
      [disabled]="!canSave()"
      [loading]="isSaving()"
      [ariaLabel]="'profile.securityPage.updatePassword' | translate"
      (clicked)="save()"
    >
      {{ 'profile.securityPage.updatePassword' | translate }}
    </shared-button>
  </div>

  @if (successMessage()) {
    <p class="text-sm text-green-600 text-center sm:text-left">{{ successMessage() }}</p>
  }
</section>
