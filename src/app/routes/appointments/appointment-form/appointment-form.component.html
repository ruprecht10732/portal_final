<div class="appointment-form-page">
  <header class="form-header">
    <button type="button" class="back-btn" (click)="goBack()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      {{ 'common.back' | translate }}
    </button>
    <h1>{{ 'appointments.form.title' | translate }}</h1>
  </header>

  @if (error()) {
    <div class="error-banner">
      {{ error() }}
    </div>
  }

  <form [formGroup]="appointmentForm" (ngSubmit)="createAppointment()" class="appointment-form">
    <div class="form-group">
      <label for="type">{{ 'appointments.form.type' | translate }}</label>
      <select id="type" formControlName="type">
        @for (opt of typeOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="title">{{ 'appointments.form.titleLabel' | translate }}</label>
      <input id="title" type="text" formControlName="title" [placeholder]="'appointments.form.titlePlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="description">{{ 'appointments.form.description' | translate }}</label>
      <textarea id="description" formControlName="description" rows="3" [placeholder]="'appointments.form.descriptionPlaceholder' | translate"></textarea>
    </div>

    <div class="form-group">
      <label for="location">{{ 'appointments.form.location' | translate }}</label>
      <input id="location" type="text" formControlName="location" [placeholder]="'appointments.form.locationPlaceholder' | translate" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startTime">{{ 'appointments.form.startTime' | translate }}</label>
        <input id="startTime" type="datetime-local" formControlName="startTime" />
      </div>
      <div class="form-group">
        <label for="endTime">{{ 'appointments.form.endTime' | translate }}</label>
        <input id="endTime" type="datetime-local" formControlName="endTime" />
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="allDay" />
        {{ 'appointments.form.allDay' | translate }}
      </label>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="sendConfirmationEmail" />
        {{ 'appointments.form.sendConfirmation' | translate }}
      </label>
    </div>

    <div class="form-actions">
      <shared-button variant="secondary" type="button" (clicked)="goBack()">
        {{ 'common.cancel' | translate }}
      </shared-button>
      <shared-button variant="primary" type="submit" [disabled]="appointmentForm.invalid || saving()">
        @if (saving()) {
          {{ 'common.saving' | translate }}
        } @else {
          {{ 'appointments.form.create' | translate }}
        }
      </shared-button>
    </div>
  </form>
</div>
