<div class="flex flex-col w-full">
  <shared-page-header
    [title]="'catalog.products.createTitle' | translate"
    [subtitle]="'catalog.products.createSubtitle' | translate"
    [backAriaLabel]="'catalog.products.goBack' | translate"
    (back)="cancel()"
  ></shared-page-header>

  <div class="border-b border-zinc-200 px-4 sm:px-6">
    <nav class="flex gap-6" aria-label="Tabs">
      <button
        type="button"
        class="py-3 text-sm font-bold uppercase tracking-wider border-b-2 border-black text-black"
        disabled
      >
        {{ 'catalog.products.tabs.details' | translate }}
      </button>
      <button
        type="button"
        class="py-3 text-sm font-bold uppercase tracking-wider border-b-2 border-transparent text-zinc-400 cursor-not-allowed"
        disabled
        title="{{ 'catalog.products.hints.materialsAfterCreate' | translate }}"
        aria-describedby="catalog-create-tabs-hint"
      >
        {{ 'catalog.products.tabs.materials' | translate }}
      </button>
      <button
        type="button"
        class="py-3 text-sm font-bold uppercase tracking-wider border-b-2 border-transparent text-zinc-400 cursor-not-allowed"
        disabled
        title="{{ 'catalog.products.hints.materialsAfterCreate' | translate }}"
        aria-describedby="catalog-create-tabs-hint"
      >
        {{ 'catalog.products.tabs.assets' | translate }}
      </button>
    </nav>
    <p id="catalog-create-tabs-hint" class="text-xs text-zinc-500 uppercase tracking-widest pb-3">
      {{ 'catalog.products.hints.materialsAfterCreate' | translate }}
    </p>
  </div>

  <!-- Error Alert -->
  @if (error()) {
    <div class="bg-red-50 border-b border-red-500 text-red-900 p-4 text-sm font-medium flex items-start gap-3">
      <span class="font-bold uppercase text-red-600 shrink-0">{{ 'catalog.products.errorLabel' | translate }}</span>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Loading State -->
  @if (loading()) {
    <div class="flex-1 flex flex-col items-center justify-center p-12 gap-4">
      <div class="animate-spin h-10 w-10 border-4 border-zinc-100 border-t-black"></div>
      <p class="text-xs font-mono uppercase text-zinc-400">{{ 'catalog.products.loading' | translate }}</p>
    </div>
  } @else {
    <catalog-form
      [vatRates]="vatRates()"
      [saving]="saving()"
      [submitLabel]="'catalog.products.create' | translate"
      [cancelLabel]="'catalog.products.cancel' | translate"
      [showMaterialsHint]="true"
      (submitted)="save($event)"
      (cancelled)="cancel()"
    ></catalog-form>
  }
</div>
