<!-- Mobile layout -->
<div class="sm:hidden flex flex-col pb-16">
	<nav class="sticky top-0 z-40 flex items-center justify-between border-b border-gray-100 bg-white/70 px-4 py-4 backdrop-blur">
		<h1 class="text-lg font-extrabold tracking-tight text-slate-900">{{ 'navigation.dashboard' | translate }}</h1>
	</nav>

	<main class="flex flex-col">
		<!-- KPI row: horizontal scroll on mobile -->
		<div class="border-b border-gray-100 bg-white px-4 py-4">
			<app-dashboard-kpi-row />
		</div>

		<!-- Combined urgent work -->
		<div class="mt-4">
			<app-dashboard-needs-attention />
		</div>

		<!-- Pipeline overview chart -->
		<div class="mt-4">
			<app-dashboard-pipeline-overview />
		</div>

		<!-- Upcoming schedule -->
		<div class="mt-4">
			<app-dashboard-upcoming-schedule />
		</div>

		<!-- Activity feed -->
		<div class="mt-4">
			<app-dashboard-activity-feed />
		</div>

		<!-- Heatmap: full width, scrollable -->
		<div class="mt-4">
			<app-dashboard-lead-heatmap />
		</div>
	</main>
</div>

<!-- Desktop layout -->
<section class="hidden sm:flex flex-col gap-6 px-4">
	<app-dashboard-kpi-row />

	<div class="grid gap-4 grid-cols-1 lg:grid-cols-3 items-stretch">
		<!-- Main content -->
		<div class="lg:col-span-2 flex flex-col gap-4">
			<div class="grid gap-4 grid-cols-1 sm:grid-cols-2 items-stretch">
				<app-dashboard-needs-attention />
				<app-dashboard-pipeline-overview />
				<app-dashboard-lead-heatmap class="sm:col-span-2" />
			</div>
		</div>

		<!-- Right sidebar: activity feed + schedule -->
		<div class="lg:col-span-1 flex flex-col gap-4">
			<app-dashboard-activity-feed />
			<app-dashboard-upcoming-schedule />
		</div>
	</div>
</section>
