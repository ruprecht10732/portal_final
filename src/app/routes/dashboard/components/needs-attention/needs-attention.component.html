<section class="flex h-full min-h-0 flex-col gap-3">
  <header class="flex items-center justify-between gap-3 px-1">
    <h2 class="text-sm font-semibold text-zinc-900 dark:text-white min-w-0 truncate">
      {{ 'dashboard.needsAttention.title' | translate }}
    </h2>

    <div class="inline-flex shrink-0 rounded-full border border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 p-1 gap-1">
      <button
        type="button"
        class="rounded-full px-3 py-1 text-[11px] font-semibold transition-colors"
        [class]="activeTab() === 'actionItems'
          ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm'
          : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200'"
        (click)="setTab('actionItems')"
      >
        {{ 'dashboard.needsAttention.actionItems' | translate }}
      </button>

      <button
        type="button"
        class="rounded-full px-3 py-1 text-[11px] font-semibold transition-colors"
        [class]="activeTab() === 'draftApprovals'
          ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm'
          : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200'"
        (click)="setTab('draftApprovals')"
      >
        {{ 'dashboard.needsAttention.draftApprovals' | translate }}
      </button>

      <button
        type="button"
        class="rounded-full px-3 py-1 text-[11px] font-semibold transition-colors"
        [class]="activeTab() === 'staleLeads'
          ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm'
          : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200'"
        (click)="setTab('staleLeads')"
      >
        {{ 'dashboard.needsAttention.staleLeads' | translate }}
      </button>
    </div>
  </header>

  @if (activeTab() === 'actionItems') {
    <app-dashboard-action-items class="min-h-0 flex-1" />
  } @else if (activeTab() === 'draftApprovals') {
    <app-dashboard-draft-approvals class="min-h-0 flex-1" />
  } @else {
    <app-dashboard-stale-leads class="min-h-0 flex-1" />
  }
</section>
